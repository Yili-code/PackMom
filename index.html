<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媽媽的旅遊打包檢查器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 為了媽媽的手機體驗，優化點擊時的藍色高亮陰影 */
        -webkit-tap-highlight-color: transparent;
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex justify-center items-start p-4 antialiased">

    <main class="w-full max-w-md bg-gray-800 rounded-3xl shadow-2xl border border-gray-700 overflow-hidden mt-4">
        
        <header class="p-6 bg-gradient-to-r from-black to-blue-400 shadow-md">
            <h1 class="text-2xl font-bold tracking-wide text-white">基礎模板</h1>
            <p class="text-xs font-bold text-white mt-1 opacity-90">勾選後的物品會自動沉到底部</p>
        </header>

        <div id="checklist-container" class="p-4 space-y-3 max-h-[70vh] overflow-y-auto"></div>
    </main>

    <script>
        let items = [
            { id: "d1", name: "醫療與身體防護", isDivider: true },
            { id: 1, name: "脖圍（防曬）", isDone: false },
            { id: 2, name: "電解質粉", isDone: false },
            { id: 3, name: "暈車藥", isDone: false },
            { id: 4, name: "過敏咳藥", isDone: false },
            { id: 5, name: "氧木斯", isDone: false },
            { id: 6, name: "蘆薈（曬傷用）", isDone: false },

            { id: "d2", name: "個人護理", isDivider: true },
            { id: 7, name: "乳液", isDone: false },
            { id: 8, name: "修護霜／精華液體", isDone: false },
            { id: 9, name: "卸妝面紙", isDone: false },

            { id: "d3", name: "生活雜項", isDivider: true },
            { id: 10, name: "內衣袋 2 個、大洗衣袋 2 個", isDone: false },
            { id: 11, name: "拖鞋", isDone: false },
            { id: 12, name: "行李（轉機領取）", isDone: false },
            { id: 13, name: "「快速」VPN 帳號截圖", isDone: false }
        ];

        function renderList() {
            const container = document.getElementById('checklist-container');
            container.innerHTML = ''; 

            const partitioned = [];
            let currentSection = null;

            items.forEach(item => {
                if (item.isDivider) {
                    currentSection = { divider: item, elements: [] };
                    partitioned.push(currentSection);
                } else if (currentSection) {
                    currentSection.elements.push(item);
                }
            });

            const htmlString = partitioned.map(section => {
                const dividerHtml = `
                    <div class="pt-4 pb-1 border-b border-gray-700">
                        <h2 class="text-lg font-bold text-gray-400">${section.divider.name}</h2>
                    </div>
                `;

                // Sort intra-section items so checked elements sink to the bottom
                const sortedItems = [...section.elements].sort((a, b) => a.isDone - b.isDone);

                const itemsHtml = sortedItems.map(item => `
                    <div onclick="toggleItem(${item.id})" class="flex justify-between items-center bg-[#2d3748] p-4 rounded-xl border border-gray-700/50 hover:bg-gray-700 transition active:scale-[0.98] cursor-pointer selection:bg-transparent">
                        <span class="text-lg font-medium tracking-wide transition-all duration-300 ${item.isDone ? 'line-through text-gray-500 opacity-50' : 'text-gray-100'}">
                            ${item.name}
                        </span>
                        <input type="checkbox" ${item.isDone ? 'checked' : ''} class="w-6 h-6 rounded-md accent-blue-500 pointer-events-none">
                    </div>
                `).join('');

                return dividerHtml + itemsHtml;
            }).join('');
            
            container.innerHTML = htmlString;
        }

        window.toggleItem = function(id) {
            const targetItem = items.find(item => item.id === id);
            if (targetItem) {
                targetItem.isDone = !targetItem.isDone;
                renderList();
            }
        }

        renderList();
    </script>
</body>
</html>
